[package]
name = "minbas78"
version = "0.0.1"
authors = ["foprofile"]
edition = "2024"
rust-version = "1.99.1"
description = "Minimal BASIC 1978 Compiler"
documentation = "https://docs.rs/minbas78/latest/minbas78/"
readme = "README.md"
homepage = "https://minbas78.github.io/minbas78/"
repository = "https://github.com/minbas78/minbas78"
license = "MIT OR Apache-2.0"
keywords = ["ansi", "basic", "compiler", "dartmouth", "ecma"]
categories = ["command-line-utilities", "compilers", "development-tools"]
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "minbas78"
path = "src/main.rs"
doctest = true

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
cc = { version = "1.4.3", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["derive", "cargo", "std", "help"] }
config = "0.15.27"
const_format = { version = "0.2.37", default-features = false }
cranelift = { version = "0.134.3", default-features = false, features = ["frontend"] }
cranelift-codegen = { version = "0.134.3", default-features = false }
cranelift-module = { version = "0.134.3", default-features = false }
cranelift-object = { version = "0.134.3", default-features = false }
from-pest = { version = "0.3.4", default-features = false }
gimli = { version = "0.34.0", default-features = false }
pest = { version = "2.8.8", default-features = false }
pest-ast = { version = "0.3.6", default-features = false }
pest_derive = { version = "2.8.8", default-features = false, features = ["std"] }
rand = { version = "0.10.2", default-features = false, features = ["std_rng"] }
regex-lite = { version = "0.1.9", default-features = false, features = ["std", "string"] }
thiserror = { version = "2.0.21", default-features = false }

[build-dependencies]
embed-resource = { version = "3.0.12", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
strip = "symbols"
debug = 0
